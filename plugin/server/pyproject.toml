# Runtime of the Claude plugin: pins br-eli-mcp and every transitive dependency
# (with hashes) in uv.lock, so the plugin runs exactly what was reviewed.
# Started by plugin.json as: uv run --frozen --project ${CLAUDE_PLUGIN_ROOT}/server br-eli-mcp
[project]
name = "br-eli-mcp-plugin-runtime"
version = "0.8.3"
requires-python = ">=3.11,<3.14"
dependencies = ["br-eli-mcp==0.8.3"]

[tool.uv]
package = false
